# Menjalankan aplikasi + PostgreSQL:   docker compose up -d --build
# Hanya database (untuk development):  npm run db:up   (memakai docker-compose.dev.yml)
#
# Konfigurasi dibaca dari file .env di folder ini (contoh: .env.production.example).

services:
  db:
    image: postgres:17-alpine
    container_name: ancestry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ancestry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ancestry}
      POSTGRES_DB: ${POSTGRES_DB:-ancestry}
    # Sengaja tidak membuka port ke host: app mengakses database lewat jaringan internal
    # "ancestry-net", jadi tidak bentrok dengan Postgres lain di server.
    # Untuk development lokal, port dibuka lewat docker-compose.dev.yml.
    volumes:
      - ancestry-data:/var/lib/postgresql/data
    networks:
      ancestry:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ancestry-app:latest
    container_name: ancestry-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ancestry}:${POSTGRES_PASSWORD:-ancestry}@db:5432/${POSTGRES_DB:-ancestry}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # Lihat .env.production.example. Kosong = otomatis dari header x-forwarded-proto.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - ancestry

volumes:
  ancestry-data:

# Jaringan bernama tetap agar app selalu bisa menemukan "db",
# apa pun nama folder / versi docker compose yang dipakai.
networks:
  ancestry:
    name: ancestry-net
